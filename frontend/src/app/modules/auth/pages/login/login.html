<h1 style="margin:0 0 4px;font-size:24px">Iniciar sesión</h1>
<p style="margin:0 0 20px;color:#70757a">Accede a tus viajes, check-in y equipaje.</p>
@if (error()) { <p class="alert alert--error" role="alert">{{ error() }}</p> }
<form (ngSubmit)="submit()" #f="ngForm">
    <div class="field"><label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required [(ngModel)]="correo"></div>
    <div class="field"><label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="password"></div>
    <button class="btn btn--primary btn--block" [disabled]="f.invalid || loading()">{{ loading() ? 'Ingresando…' : 'Ingresar' }}</button>
</form>
<p style="text-align:center;margin:18px 0 0;font-size:14px">¿Primera vez? <a routerLink="/auth/register" [queryParams]="redirectParams" style="color:#C8102E;font-weight:700">Crea tu cuenta</a></p>
