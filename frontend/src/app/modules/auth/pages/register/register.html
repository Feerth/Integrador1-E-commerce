<h1 style="margin:0 0 4px;font-size:24px">Crear cuenta</h1>
<p style="margin:0 0 20px;color:#70757a">Si ya compraste con nosotros, usa el mismo DNI y correo para ver tus reservas.</p>
@if (error()) { <p class="alert alert--error" role="alert">{{ error() }}</p> }
<form (ngSubmit)="submit()" #f="ngForm">
    <div class="field"><label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" autocomplete="name" required minlength="3" [(ngModel)]="d.nombre"></div>
    <div class="field"><label for="dni">DNI</label>
        <input id="dni" name="dni" inputmode="numeric" pattern="\d{8}" maxlength="8" required [(ngModel)]="d.dni"></div>
    <div class="field"><label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required [(ngModel)]="d.correo"></div>
    <div class="field"><label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" [(ngModel)]="d.telefono"></div>
    <div class="field"><label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required [(ngModel)]="d.password">
        <span class="hint">Mínimo 6 caracteres.</span></div>
    <button class="btn btn--primary btn--block" [disabled]="f.invalid || loading()">{{ loading() ? 'Creando…' : 'Crear cuenta' }}</button>
</form>
<p style="text-align:center;margin:18px 0 0;font-size:14px">¿Ya tienes cuenta? <a routerLink="/auth/login" style="color:#C8102E;font-weight:700">Inicia sesión</a></p>
